<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {%- seo -%}
  <!--  <link rel="stylesheet" href="{{ site.baseurl }}/assets/main.css | relative_url">-->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}" />
  {%- feed_meta -%} {%- if jekyll.environment == 'production' and
  site.google_analytics -%} {%- include google-analytics.html -%} {%- endif -%}

  <!-- /favicon.ico-->
  <link rel="icon" href="data:," />

  <!-- Font Awesome 6 CDN，引入一些图标 -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <!-- 公式行内引用-->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [
          ['$$', '$$'],
          ['\\[', '\\]'],
        ],
      },
      chtml: {
        scale: 0.92 /* 🌟 将默认 100% 缩小到 92%，让行内公式与周围文字完美契合 */
      },
      svg: {
        scale: 0.92 /* 如果你使用的是 SVG 模式，也加上这一行 */
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>
